name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Tag, mod_info.json, the version file (read by TriOS / Version Checker) and a dated
      # changelog.txt entry must all agree, and the JSON files must parse.
      - name: Check versions
        run: |
          V="${GITHUB_REF_NAME#v}"
          jq empty data/config/settings.json
          [ "$(jq -r .version mod_info.json)" = "$V" ] || { echo "::error::mod_info.json version is not $V"; exit 1; }
          F=Command-Saturation-Protocol.version
          [ "$(jq -r '"\(.modVersion.major).\(.modVersion.minor).\(.modVersion.patch)"' $F)" = "$V" ] || { echo "::error::$F modVersion is not $V"; exit 1; }
          jq -r .directDownloadURL $F | grep -q "/v$V/Command-Saturation-Protocol-v$V.zip$" || { echo "::error::$F directDownloadURL is not for v$V"; exit 1; }
          grep -qE "^Version $V \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" changelog.txt || { echo "::error::changelog.txt needs 'Version $V (YYYY-MM-DD)'"; exit 1; }

      - name: Package
        run: |
          D="Command-Saturation-Protocol"
          mkdir "$D"
          cp -r mod_info.json Command-Saturation-Protocol.version changelog.txt README.md data graphics "$D/"
          zip -r "$D-$GITHUB_REF_NAME.zip" "$D"
          # Release notes = this version's section of changelog.txt.
          awk -v h="Version ${GITHUB_REF_NAME#v} " '/^Version /{p = index($0, h) == 1} p' changelog.txt > notes.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Command Saturation Protocol ${{ github.ref_name }}
          files: Command-Saturation-Protocol-${{ github.ref_name }}.zip
          body_path: notes.txt
